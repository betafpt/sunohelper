name: Deploy Chrome Extension

on:
  push:
    tags:
      - 'v*' # Chạy tự động khi bạn tạo và push một tag phiên bản mới (ví dụ: v1.0.0)
  # Hoặc bạn có thể mở cấu hình dưới đây nếu muốn tự động chạy mỗi khi push lên nhánh main:
  # push:
  #   branches:
  #     - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build zip package
        run: |
          # Đóng gói các thư mục và file cần thiết của tiện ích, loại bỏ các file rác và file git
          zip -r extension.zip icons manifest.json popup scripts

      - name: Upload & Publish to Chrome Web Store
        uses: passmarked/chrome-webstore-upload-action@v1.2.0
        with:
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
