<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.Rythm AI Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="glass-shell">
    <main class="container glass-card" aria-labelledby="popup-title">
        <div class="logo-wrapper glass-logo">
            <img src="../icons/logo.png" alt="RYTHM Logo" id="main-logo">
        </div>
        <div class="popup-heading">
            <span class="eyebrow">AI Music Studio</span>
            <h1 id="popup-title">G.Rythm Manager</h1>
        </div>
        <p class="subtitle">Cài đặt API Key để bắt đầu sử dụng RYTHM trên Suno.</p>
        
        <div class="form-group">
            <label for="apiKey">OpenAI / 302.ai API Key:</label>
            <input type="password" id="apiKey" placeholder="Nhập API Key của bạn...">
        </div>
        
        <button id="saveBtn" class="glass-button" type="button">Lưu API Key</button>
        <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
