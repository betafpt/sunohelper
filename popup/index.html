<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.Rythm AI Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo-wrapper">
            <img src="../icons/logo.png" alt="RYTHM Logo" id="main-logo">
        </div>
        <p class="subtitle">Cài đặt API Key để bắt đầu sử dụng RYTHM trên Suno.</p>
        
        <div class="form-group">
            <label for="apiKey">OpenAI / 302.ai API Key:</label>
            <input type="password" id="apiKey" placeholder="Nhập API Key của bạn...">
        </div>
        
        <button id="saveBtn">Save Key</button>
        <div id="status"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
